services:
  db:
    image: mongo:latest
    container_name: photoshare_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: photoshare_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://db:27017/photoshare
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: photoshare_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data: